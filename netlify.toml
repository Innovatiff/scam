# Netlify build & hosting config for IsThisAScam
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed/static assets — cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — short cache so content updates appear quickly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ads.txt and sitemap should always be fresh.
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=600"
